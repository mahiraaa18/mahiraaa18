<svg xmlns="http://www.w3.org/2000/svg" width="139" height="28" viewBox="0 0 139 28">
  <defs>
    <clipPath id="capsule-clip">
      <rect width="139" height="28" rx="14" ry="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#capsule-clip)">
    <!-- Base background: same color across entire pill -->
    <rect width="139" height="28" fill="#238B7E"/>
    <!-- Right side subtle backing for emoji -->
    <rect x="111" y="0" width="28" height="28" fill="#000000" fill-opacity="0.08"/>
    <!-- Divider seam line -->
    <line x1="111" y1="0" x2="111" y2="28" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Left text -->
    <text x="56" y="18" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Incident Response</text>
    <!-- Right emoji -->
    <text x="125" y="19" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif" font-size="12" text-anchor="middle">🚨</text>
  </g>
</svg>